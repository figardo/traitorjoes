TraitorJoes.Joe.Shop.Item.Poltergeist=Нет, серьезно, мы посадили злого призрака внутрь каждой штуки, которую оно стреляет.
TraitorJoes.Joe.Shop.Item.Silenced=Оказалось, что если сделать выстрелы тише, люди перестают кричать, когда их ранят. Кто бы мог подумать!
TraitorJoes.Joe.Shop.Item.Decoy=Если твой Детектив слишком часто использует сканер ДНК, это быстро поставит их на место.
TraitorJoes.Joe.Shop.Item.C4=Установи одну из этих красоток на маленькой карте, и весь сервер придет в движение.
TraitorJoes.Joe.Shop.Item.Visualizer=Полезно, чтобы выяснить, где прячется надоедливый снайпер.
TraitorJoes.Joe.Shop.Item.Defuser=Иногда приходится иметь дело с чьей-то десятиминутной C4.
TraitorJoes.Joe.Shop.Item.Binoculars=Если у тебя есть Предатели, которые думают, что можно просто скинуть труп со здания и на этом все закончится...
TraitorJoes.Joe.Shop.Item.UMP=Если ты хочешь ПО-НАСТОЯЩЕМУ разозлить того, в кого стреляешь...
TraitorJoes.Joe.Shop.Item.HStation=Твои собратья скажут тебе спасибо, но и Предатели тоже, если будешь неосторожен.

TraitorJoes.Joe.Shop.Item.MAC10=Знаешь, я позаимствовал пару этих дизайнов из какого-то зомби-мода...
TraitorJoes.Joe.Shop.Item.M16=Стало стыдно за низкую скорость, поэтому мы сделали так, что прицел магическим образом приближает камеру.
TraitorJoes.Joe.Shop.Item.Rifle=Ощущения просто шикарные, если выстрелы на твоей стороне.
TraitorJoes.Joe.Shop.Item.Shotgun=Она может выглядеть как автоматическая, но тебе придется делать хорошую долгую паузу между выстрелами.. по игровым причинам.
TraitorJoes.Joe.Shop.Item.HUGE=Когда-нибудь проектировал оружие в пьяном виде? Да больше никогда.
TraitorJoes.Joe.Shop.Item.Pistol=Может, это и не ваншот в голову, но... ладно, да, мне нечего сказать.
TraitorJoes.Joe.Shop.Item.Deagle=Акционеры просят мне это понерфить.
TraitorJoes.Joe.Shop.Item.Glock=Довольно хорошо щекочет людей на расстоянии.
TraitorJoes.Joe.Shop.Item.Incendiary=Щекочет целую область до смерти.
TraitorJoes.Joe.Shop.Item.Discomb=Это не RDM если сами разбиваются насмерть.
TraitorJoes.Joe.Shop.Item.Smoke=Может, он и не слишком хорошо блокирует обзор, но брось пару штук в комнату, и он отлично посадит FPS.
TraitorJoes.Joe.Shop.Item.Crowbar=Толкай друзей, когда они меньше всего этого ожидают, им это понравится.
TraitorJoes.Joe.Shop.Item.Magneto=Тренируй свои пропубийства снаружи.
TraitorJoes.Joe.Shop.Item.Unarmed=Что? Я не продаю тебе "ничего", я продаю тебе способность держать "ничего" в руках.

TraitorJoes.Shop.MAC10=Пистолет-пулемет с высокой скорострельностью.\n\nУрон от хедшота падает с расстоянием.
