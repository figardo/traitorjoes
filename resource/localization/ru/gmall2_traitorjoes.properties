TraitorJoes.Joe.Shop.Item.Armor=Отличный выбор если вы не в настроение умирать.
TraitorJoes.Joe.Shop.Item.Radar=Слыш, не буду обвинять, но на некоторых картах вам это ДЕЙСТВИТЕЛЬНО нужно.
TraitorJoes.Joe.Shop.Item.Disguiser=Также скрывает вас от радаров детективов!
