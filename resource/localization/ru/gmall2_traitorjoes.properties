TraitorJoes.GMall.Subject=Добро пожаловать в Garry's Mall!
TraitorJoes.GMall.Text=Привет, <name>!\n\nСпасибо, что выбрали Garry's Mall в качестве места для вашего магазина!\n\nСегодня вы присоединились к замечательному сообществу из <shop_count> магазинов!\n\nПоскольку вы приобрели пакет <package_tier>, мы назначим вам маппера с опытом НОВИЧКА!\n\nВаш назначенный маппер: figardo\n\nНадеемся, вам понравится процесс открытия магазина в Garry's Mall!

TraitorJoes.Shareholders=Акционеры
TraitorJoes.TradeSecrets.Subject=Коммерческие тайны
TraitorJoes.TradeSecrets.Text=Дорогой Джо,\n\nКак и просили, вот три главных секрета, которые нужно помнить при ведении хорошей торговли:\n\n1) Никогда не заключайте торговые сделки после времени отхода ко сну (20:00 в большинстве юрисдикций)\n\n2) Помните, что нужно аккуратно скрещивать ноги, когда сидите, и вежливо слушать, когда другие обсуждают бизнес.\n\n3) Если переговоры, кажется, зашли в тупик, приведите в действие план, чтобы щекотать их, пока они не согласятся на ваши условия.\n\nПожалуйста, храните эти коммерческие тайны в строжайшей конфиденциальности.\n\nС уважением,\nАкционеры

# привет, почтальон печкин. добавь свое имя в список когда делаешь перевод. славу.. ээ.. как тем его..
TraitorJoes.Translation.Subject=Требуются переводчики!
TraitorJoes.Translation.Text=Привет всем, пишу на GitHub, потому что слышал, что именно там находятся все готовые работать волонтеры!\n\nВ рамках усилий по повышению мировой привлекательности Traitor Joe's, мы хотим узнать, готов ли кто-нибудь выступить в роли официального переводчика диалогов Traitor Joe.\n\nХотя я не буду вам платить или что-то в этом роде, было бы действительно круто, если бы все могли посмеяться над моим понятным и самосознающим диалогом. Я имею в виду, эй, этого было бы достаточно, чтобы мотивировать меня это делать!\n\nО, и еще я могу просто заплатить вам известностью. Говорят, в наши дни это ценнее валюты, верно?\n\nНаши текущие переводчики:\nCoralCinder (RU)\n\nОни проделали великолепную работу, заставляя моих клиентов смеяться, и вы тоже сможете!\n\nЧтобы зарегистрироваться, вы можете отправить "pull request", используя "этот файл" (что бы это ни значило):\nhttps://github.com/figardo/traitorjoes/blob/main/resource/localization/en/gmall2_traitorjoes.properties\n\nС нетерпением жду встречи со всеми нашими новыми неоплачиваемыми волонтерами в ближайшее время!\n\nС уважением,\nПредатель Джо\n\n\n---ОШИБКА ОТПРАВКИ СООБЩЕНИЯ: ДОМЕН "github.com" ОФФЛАЙН---

TraitorJoes.Garry.Subject=ПРИВЕТ, ГАРРИ
TraitorJoes.Garry.Text=эй г арри\n\nизвини я сейчас немного пьян хаха\n\nможешь добавить TTT как пак для песочницы\n\nя имею в виду s&box\n\nэто было бы ПриК00льно :-D\n\nЯ бы также получил больше бизнеса ЛОЛ\n\nПожалуйста\nПредатель Джо\n\nP.S. пожалуйста забань сервера с инвентарями это как-то аморально поддерживать их спасибо

TraitorJoes.RadioStation.Subject=Радиостанция
TraitorJoes.RadioStation.Text=Привет, BKU,\n\nЧто касается твоей идеи о магазинной радиостанции на новом месте, звучит отлично!\n\nЯ начну работу над этим в выходные.\n\nЯ уже составил список персонала, который идеально подошел бы для запуска этого проекта.\n\nВ число актеров озвучивания вошли бы (в гипотетическом порядке):\nRichter Overtime\ndimbeak\nCalypso\nGoldec\nratlobber\nOsseus\nSjors\nPigSheepCowDuck\nYashirmare\nmatson01\nemaqed\ndacoobers\nfigardo\nStuffed Carlos\nSpeedster120\n\nС песнями, созданными:\nRichter Overtime и ratlobber\nBoyinaband и TheRPGMinx\nJerryC\nNastelBom\n\nИ дополнительным сведением:\ndimbeak\nratlobber\n\nОднако, поскольку в настоящее время мы работаем в условиях жесткого бюджета, мы не можем позволить себе никого из вышеперечисленных людей.\n\nНо не волнуйся, я довольно хороший актер озвучивания. :-)\n\nС уважением,\nПредатель Джо

TraitorJoes.NewLocation.Subject=Новое местоположение
TraitorJoes.NewLocation.Text=Привет, BKU,\n\nРад слышать, что переезд в GMall идет хорошо.\n\nЯ попросил несколько человек о дополнительной помощи. В частности:\n\n- crowtroopa помог мне придать этому компьютеру брендинг Traitor Joe's!\n\n- Richter Overtime пожертвовал плакат для продвижения нашей новой радиостанции!\n\nТакие милые люди. Надеюсь, ты поблагодаришь их в следующий раз, когда увидишь их в магазине.\n\nС уважением,\nПредатель Джо

