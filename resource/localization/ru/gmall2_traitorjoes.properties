TraitorJoes.Shop.Rifle=Снайперская винтовка с продольно-скользящим затвором и прицелом.\n\nТочная, с потенциалом убийства с одного выстрела в голову.
TraitorJoes.Shop.Shotgun=Выстреливает 8 дробинок за раз.\n\nНизкая скорострельность.
TraitorJoes.Shop.HUGE=Ручной пулемет для ближнего боя.\n\nЧрезвычайно неточный, с высокой отдачей.
TraitorJoes.Shop.Pistol=Умеренный урон и скорострельность.
TraitorJoes.Shop.Deagle=Убивает с одного выстрела в голову.\n\nВысокая отдача.
TraitorJoes.Shop.Glock=Автоматический пистолет.\n\nНизкий урон.
TraitorJoes.Shop.Incendiary=Создает вредоносный огонь.
