TraitorJoes.GMall.Subject=Garry's Mall'a hoş geldin!
TraitorJoes.GMall.Text=Merhaba <name>!\n\nGarry's Mall'u mağazanızın konumu olarak seçtiğiniz için teşekkürler!\n\nBugün harika bir <shop_count> mağaza topluluğuna katıldın!<package_tier> paketini satın aldığın için sana ACEMİ deneyiminin bir haritacısını atayacağız!\n\nAtanan haritacınız: figardo\n\nGarry's Mall'da mağaza kurma deneyiminizden keyif alacağınızı umuyoruz!

TraitorJoes.Shareholders=Hissedarlar
TraitorJoes.TradeSecrets.Subject=Ticari Sırlar
TraitorJoes.TradeSecrets.Text=Sevgili Joe,\n\nTalep edildiği gibi, iyi bir işlem yaparken akılda tutulması gereken en büyük üç sır:\n\n1) Yatma saatinden sonra asla bir ticaret anlaşması yapmayın (çoğu yargı alanında akşam 8'de)\n\n2) Otururken bacak bacak üstüne atmayı ve başkaları iş konuşurken nazikçe dinlemeyi unutmayın.\n\n3) Müzakereler durgun görünüyorsa, şartlarınızı kabul edene kadar onları gıdıklamak için bir plan yapın.\n\nLütfen bu ticari sırları son derece gizli tutun.\n\nSaygılarımızla,\nHissedarlar

TraitorJoes.Garry.Subject=MERHABA GARRY
TraitorJoes.Garry.Text=Hey garry\n\nÜzgünüm şu an biraz sarhoşum haha\n\nTTT'yi sandbox için paket olarak ekleyebilir misiniz?\n\nYani s&box.\n\nC00l :-D olurdu\n\nAyrıca daha fazla iş alırdım LMAO\n\nLütfen,\nHain Joe\n\nNot: Lütfen envanter sunucularını yasaklayın, onların açık kalması ahlak dışı. Teşekkürler.

TraitorJoes.RadioStation.Subject=Radyo İstasyonu
TraitorJoes.RadioStation.Text=Hey BKU,\n\nYeni konumdaki bir mağaza radyo istasyonu fikrine gelince, kulağa harika geliyor!\n\nHafta sonu üzerinde çalışmaya başlayacağım.\n\nBu projeyi hayata geçirmek için ideal olabilecek bir personel listesi hazırladım bile.\n\nSes aktörleri şunları içerecektir (varsayımsal sırayla):\nRichter Overtime\ndimbeak\nCalypso\nGoldec\nratlobber\nOsseus\nSjors\nPigSheepCowDuck\nYashirmare\nmatson01\nemaqed\ndacoobers\nfigardo\nStuffed Carlos\n\nMüzik:\nRichter Overtime and ratlobber\nBoyinaband and TheRPGMinx\n\nEk Mix:\ndimbeak\nratlobber\n\nAncak, şu anda sıkı bir bütçeyle çalıştığımız için, yukarıda belirtilen kişilerin hiçbirini karşılayamıyoruz.\n\nYine de endişelenme, ben oldukça iyi bir seslendirme sanatçısıyım :-)\n\nSaygılarımla,\nHain Joe

TraitorJoes.NewLocation.Subject=Yeni Konum
TraitorJoes.NewLocation.Text=Hey BKU,\n\nGMall'a geçişin iyi gittiğini duymak güzel.\n\nBirkaç kişiden ek yardım istedim. Özellikle:\n\n- crowtroopa, bu bilgisayara Hain Joe'nun damgasını vurmama yardım etti!\n\n- Richter Overtime, yeni radyo istasyonumuzu tanıtmak için bir poster bağışladı!\n\nNe tatlılar. Umarım onları bir dahaki sefere mağazada gördüğünde teşekkür edersin.\n\nSaygılarımla,\nHain Joe

